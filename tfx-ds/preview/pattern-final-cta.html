<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Final CTA</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/tradeify-fx/components.css">
<style>
body{margin:0;padding:28px;background:var(--tfx-bg-page);color:var(--tfx-text-primary);font:var(--text-s-regular)}
.h{font:var(--text-labels-overline);text-transform:uppercase;color:var(--tfx-text-muted);margin:0 0 14px;letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.col{display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:28px}
.meta{font:var(--text-labels-meta);color:var(--tfx-text-muted)}
.cap{font:var(--text-xs-regular);color:var(--tfx-text-secondary)}
code{font:var(--text-labels-meta);color:var(--color-cyan-300)}
.fc{display:flex;flex-direction:column;align-items:center;gap:40px;padding:60px 20px;border-radius:16px;background:radial-gradient(50% 80% at 10% 90%,rgba(0,141,173,.55),transparent 70%),radial-gradient(40% 60% at 90% 0,rgba(0,109,133,.4),transparent),var(--tfx-bg-page)}</style></head>
<body class="tfx">
<div class="fc"><div class="tfx-section-head"><span class="tfx-badge">Start today</span><h2 class="t-h1">Ready to start your path to live capital?</h2><p>Choose your plan, trade with clear rules, and scale toward live capital.</p></div>
<div class="tfx-actions" style="justify-content:center"><button class="tfx-btn" data-hierarchy="primary" data-size="l"><span class="tfx-btn__face">Explore Plans<i class="tfx-bolt" aria-hidden="true"></i></span></button><button class="tfx-btn" data-hierarchy="secondary" data-size="l"><span class="tfx-btn__face">Compare Plans</span></button></div><span class="meta t-upper">One-time fee. No subscriptions or activation costs.</span></div>

</body></html>
