<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero & promo card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/tradeify-fx/components.css">
<style>
body{margin:0;padding:28px;background:var(--tfx-bg-page);color:var(--tfx-text-primary);font:var(--text-s-regular)}
.h{font:var(--text-labels-overline);text-transform:uppercase;color:var(--tfx-text-muted);margin:0 0 14px;letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.col{display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:28px}
.meta{font:var(--text-labels-meta);color:var(--tfx-text-muted)}
.cap{font:var(--text-xs-regular);color:var(--tfx-text-secondary)}
code{font:var(--text-labels-meta);color:var(--color-cyan-300)}
</style></head>
<body class="tfx">
<p class="h">Hero copy block + promo carousel card</p>
<div class="tfx-hero__copy"><span class="tfx-badge" style="align-self:flex-start">Built for forex traders</span><h1>Choose Your Path. Progress to Live Capital.</h1>
<ul class="tfx-bolt-list"><li><i class="tfx-bolt" aria-hidden="true"></i>Daily, Classic &amp; Direct Plans</li><li><i class="tfx-bolt" aria-hidden="true"></i>Instant Sim Funding Available</li></ul><div class="tfx-actions"><button class="tfx-btn" data-hierarchy="primary" data-size="l"><span class="tfx-btn__face">Explore Plans<i class="tfx-bolt" aria-hidden="true"></i></span></button><button class="tfx-btn" data-hierarchy="secondary" data-size="l"><span class="tfx-btn__face">Compare Plans</span></button></div></div>
<div style="height:32px"></div><div class="tfx-promo"><div class="tfx-promo__content"><div><span class="tfx-badge">Three plans</span><h3>Choose Your Trading Path</h3><p>Compare Daily, Classic, and Direct to find the right path to funded trading.</p></div><button class="tfx-btn" data-hierarchy="primary" data-size="m"><span class="tfx-btn__face">Compare Plans<i class="tfx-bolt" aria-hidden="true"></i></span></button></div><div class="tfx-dots"><i class="is-active"></i><i></i><i></i><i></i></div></div>

</body></html>
