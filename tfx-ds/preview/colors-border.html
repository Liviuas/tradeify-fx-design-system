<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Border colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/tradeify-fx/components.css">
<style>
body{margin:0;padding:28px;background:var(--tfx-bg-page);color:var(--tfx-text-primary);font:var(--text-s-regular)}
.h{font:var(--text-labels-overline);text-transform:uppercase;color:var(--tfx-text-muted);margin:0 0 14px;letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.col{display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:28px}
.meta{font:var(--text-labels-meta);color:var(--tfx-text-muted)}
.cap{font:var(--text-xs-regular);color:var(--tfx-text-secondary)}
code{font:var(--text-labels-meta);color:var(--color-cyan-300)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.sw{display:flex;flex-direction:column;gap:3px;min-width:0}.sw b{font:var(--text-xs-semibold);color:var(--tfx-text-strong)}
.sw span{font:var(--text-labels-meta);color:var(--tfx-text-muted)}.sw code{font-size:10px;overflow-wrap:anywhere}
.chip{height:56px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--color-border-100);
background-image:linear-gradient(45deg,#1a1f21 25%,transparent 25%,transparent 75%,#1a1f21 75%),linear-gradient(45deg,#1a1f21 25%,transparent 25%,transparent 75%,#1a1f21 75%);}
.chip{background-size:auto}</style></head>
<body class="tfx">
<p class="h">Border · Jet Stream at 10–72% alpha</p><div class="grid"><div class="sw"><div class="chip" style="background:var(--color-border-50)"></div><b>Border/50</b><code>--color-border-50</code><span>#BBCAC71A</span></div><div class="sw"><div class="chip" style="background:var(--color-border-100)"></div><b>Border/100</b><code>--color-border-100</code><span>#BBCAC71F</span></div><div class="sw"><div class="chip" style="background:var(--color-border-200)"></div><b>Border/200</b><code>--color-border-200</code><span>#BBCAC729</span></div><div class="sw"><div class="chip" style="background:var(--color-border-300)"></div><b>Border/300</b><code>--color-border-300</code><span>#BBCAC733</span></div><div class="sw"><div class="chip" style="background:var(--color-border-400)"></div><b>Border/400</b><code>--color-border-400</code><span>#BBCAC76B</span></div><div class="sw"><div class="chip" style="background:var(--color-border-500)"></div><b>Border/500</b><code>--color-border-500</code><span>#BBCAC7B8</span></div></div>

</body></html>
