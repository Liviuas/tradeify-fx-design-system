<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divider & data row</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/tradeify-fx/components.css">
<style>
body{margin:0;padding:28px;background:var(--tfx-bg-page);color:var(--tfx-text-primary);font:var(--text-s-regular)}
.h{font:var(--text-labels-overline);text-transform:uppercase;color:var(--tfx-text-muted);margin:0 0 14px;letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.col{display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:28px}
.meta{font:var(--text-labels-meta);color:var(--tfx-text-muted)}
.cap{font:var(--text-xs-regular);color:var(--tfx-text-secondary)}
code{font:var(--text-labels-meta);color:var(--color-cyan-300)}
</style></head>
<body class="tfx">
<p class="h">Data row (Status = Up | Down) · ticker tape</p>
<div class="tfx-ticker"><span class="tfx-datarow"><span class="tfx-datarow__pair">EUR/USD</span><span class="tfx-datarow__sep">•</span><span class="tfx-datarow__price">$ 1.02</span><span class="tfx-datarow__chg">+0.02%</span></span>
<span class="tfx-datarow" data-status="down"><span class="tfx-datarow__pair">EUR/GBP</span><span class="tfx-datarow__sep">•</span><span class="tfx-datarow__price">$ 0.87</span><span class="tfx-datarow__chg">-4.76%</span></span>
<span class="tfx-datarow"><span class="tfx-datarow__pair">GBP/JPY</span><span class="tfx-datarow__sep">•</span><span class="tfx-datarow__price">13.234</span><span class="tfx-datarow__chg">+27.58%</span></span>
<span class="tfx-datarow" data-status="down"><span class="tfx-datarow__pair">USD/CHF</span><span class="tfx-datarow__sep">•</span><span class="tfx-datarow__price">$ 0.91</span><span class="tfx-datarow__chg">-1.62%</span></span></div>
<p class="h" style="margin-top:24px">Divider · Horizontal / Vertical (Border/200)</p><hr class="tfx-divider"><div style="display:flex;height:40px;gap:20px;margin-top:12px"><span>A</span><hr class="tfx-divider tfx-divider--v"><span>B</span></div>

</body></html>
