<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/tradeify-fx/components.css">
<style>
body{margin:0;padding:28px;background:var(--tfx-bg-page);color:var(--tfx-text-primary);font:var(--text-s-regular)}
.h{font:var(--text-labels-overline);text-transform:uppercase;color:var(--tfx-text-muted);margin:0 0 14px;letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.col{display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:28px}
.meta{font:var(--text-labels-meta);color:var(--tfx-text-muted)}
.cap{font:var(--text-xs-regular);color:var(--tfx-text-secondary)}
code{font:var(--text-labels-meta);color:var(--color-cyan-300)}
.sp{display:grid;grid-template-columns:120px 50px 1fr;gap:12px;align-items:center}.bar{height:10px;border-radius:2px;background:var(--tfx-accent)}.bar.alt{background:var(--color-brand-arctic);opacity:.7}.sp b{font:var(--text-xs-semibold)}</style></head>
<body class="tfx">
<p class="h">Figma Numbers / Spacing</p><div class="col"><div class="sp"><div class="bar" style="width:4px"></div><b>4px</b><code>--space-4</code></div><div class="sp"><div class="bar" style="width:8px"></div><b>8px</b><code>--space-8</code></div><div class="sp"><div class="bar" style="width:16px"></div><b>16px</b><code>--space-16</code></div><div class="sp"><div class="bar" style="width:20px"></div><b>20px</b><code>--space-20</code></div><div class="sp"><div class="bar" style="width:24px"></div><b>24px</b><code>--space-24</code></div><div class="sp"><div class="bar" style="width:32px"></div><b>32px</b><code>--space-32</code></div><div class="sp"><div class="bar" style="width:40px"></div><b>40px</b><code>--space-40</code></div><div class="sp"><div class="bar" style="width:48px"></div><b>48px</b><code>--space-48</code></div></div><p class="h" style="margin-top:22px">Library / layout values also in use</p><div class="col"><div class="sp"><div class="bar alt" style="width:6px"></div><b>6px</b><code>--space-6</code></div><div class="sp"><div class="bar alt" style="width:12px"></div><b>12px</b><code>--space-12</code></div><div class="sp"><div class="bar alt" style="width:14px"></div><b>14px</b><code>--space-14</code></div><div class="sp"><div class="bar alt" style="width:28px"></div><b>28px</b><code>--space-28</code></div><div class="sp"><div class="bar alt" style="width:60px"></div><b>60px</b><code>--space-60</code></div><div class="sp"><div class="bar alt" style="width:64px"></div><b>64px</b><code>--space-64</code></div><div class="sp"><div class="bar alt" style="width:92px"></div><b>92px</b><code>--space-92</code></div></div>

</body></html>
