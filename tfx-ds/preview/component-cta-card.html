<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTA card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/tradeify-fx/components.css">
<style>
body{margin:0;padding:28px;background:var(--tfx-bg-page);color:var(--tfx-text-primary);font:var(--text-s-regular)}
.h{font:var(--text-labels-overline);text-transform:uppercase;color:var(--tfx-text-muted);margin:0 0 14px;letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.col{display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:28px}
.meta{font:var(--text-labels-meta);color:var(--tfx-text-muted)}
.cap{font:var(--text-xs-regular);color:var(--tfx-text-secondary)}
code{font:var(--text-labels-meta);color:var(--color-cyan-300)}
.art{width:220px;height:160px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(85,179,199,.55),transparent 65%);filter:blur(2px)}@media(max-width:700px){.art{display:none}}</style></head>
<body class="tfx">
<p class="h">Discord / Support card</p><div class="col" style="gap:20px">
<div class="tfx-cta-card"><div class="tfx-cta-card__body"><div><h3>Join Discord<br>for <span class="tfx-accent">Live Updates</span></h3><p>Talk shop. Track progress. Move toward live capital.</p></div><button class="tfx-btn" data-hierarchy="secondary" data-size="l"><span class="tfx-btn__face">Join Discord<i class="tfx-bolt" aria-hidden="true"></i></span></button></div><div class="art"></div></div>
<div class="tfx-cta-card tfx-cta-card--center"><div class="tfx-cta-card__body"><div><h3>Have a <span class="tfx-accent">Question?</span></h3><p>Get instant answers from FinAI or speak directly with our Trader Support team.</p></div><div class="tfx-cta-card__actions"><button class="tfx-btn" data-hierarchy="primary" data-size="l"><span class="tfx-btn__face">Live Chat<i class="tfx-bolt" aria-hidden="true"></i></span></button><button class="tfx-btn" data-hierarchy="secondary" data-size="l"><span class="tfx-btn__face">Help Center</span></button></div></div></div></div>

</body></html>
